[project]
name = "nanfeng-agent"
version = "0.1.0"
description = "NanFeng agent: ingestion, quarantined extraction, orchestrator, tools, model router and channels"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nanfeng_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
