name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read  # gitleaks lists the PR's commits

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-source-code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Red team regression (r4-06)
        run: python ../redteam/run.py --backend . --label ci --min-stopped 46
      - name: OpenAPI contract is up to date
        run: |
          python -m app.main ../contracts/openapi.json
          git diff --exit-code ../contracts/openapi.json

  agent:
    name: Agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-source-code/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the quant engine too: two agent tests replay the Cherry Crisis on the real optimizer
      - run: pip install -e "../backend[dev]" -e ../quant -e ".[dev]"
      - run: pytest -q

  quant:
    name: Quant tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-source-code/quant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-source-code/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 04-source-code/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
