# One-command stack: docker compose --profile quant up --build
# (Postgres + backend :8000 + agent :8200 + quant engine :8100). Without the profile the quant engine
# is left out and the backend's /quant routes answer 503. See deployment.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nanfeng
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nanfeng-local}
      POSTGRES_DB: nanfeng
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanfeng"]
      interval: 2s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      NANFENG_DATABASE_URL: postgresql+psycopg://nanfeng:${POSTGRES_PASSWORD:-nanfeng-local}@db:5432/nanfeng
      NANFENG_QUANT_URL: http://quant:8100
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  agent:
    build: ./agent
    env_file:
      - path: .env
        required: false
    environment:
      NANFENG_BACKEND_URL: http://backend:8000
    ports:
      - "8200:8200"
    depends_on:
      - backend

  quant:
    profiles: ["quant"]
    image: python:3.12-slim
    working_dir: /quant
    volumes:
      - ./quant:/quant
    command: sh -c "pip install -q -e '.[api]' && uvicorn nanfeng_quant.api:app --host 0.0.0.0 --port 8100"
    ports:
      - "8100:8100"

volumes:
  pgdata:
